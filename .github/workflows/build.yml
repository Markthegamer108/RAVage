# builds standalone binaries for windows, macos and linux.
#
# pyinstaller cannot cross-compile, so each os builds its own copy on its
# own runner. every run uploads the binaries as artifacts; pushing a tag
# (v*) additionally attaches them to a GitHub release.
#
# on windows the gui becomes rav-tool.exe (no console window), the cli
# becomes rav-cli.exe. on macos the gui becomes rav-tool.app. on linux
# both are plain binaries.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux)
        if: runner.os == "Linux"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build deps
        run: pip install -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm --clean rav-tool.spec

      - name: Package binaries
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path rav-tool.exe, rav-cli.exe -DestinationPath rav-tool-windows.zip -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            tar -czf rav-tool-macos.tar.gz rav-tool.app rav-cli
          else
            tar -czf rav-tool-linux.tar.gz rav-tool rav-cli
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rav-tool-${{ matrix.os }}
          path: dist/rav-tool-*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, "refs/tags/")
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rav-tool-*
