# builds standalone binaries for windows, macos and linux.
#
# pyinstaller cannot cross-compile, so each os builds its own copy on its
# own runner. every run uploads the binaries as artifacts; pushing a tag
# (v*) additionally attaches them to a GitHub release.
#
# on windows the gui becomes ravage.exe (no console window), the cli
# becomes ravage-cli.exe. on macos the gui becomes ravage.app. on linux
# both are plain binaries.

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build deps
        run: pip install -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm --clean ravage.spec

      - name: Package binaries
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path ravage.exe, ravage-cli.exe -DestinationPath ravage-windows.zip -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            tar -czf ravage-macos.tar.gz ravage.app ravage-cli
          else
            tar -czf ravage-linux.tar.gz ravage ravage-cli
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ravage-${{ matrix.os }}
          path: dist/ravage-*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ravage-windows.zip
            dist/ravage-macos.tar.gz
            dist/ravage-linux.tar.gz
