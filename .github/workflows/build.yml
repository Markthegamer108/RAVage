name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ravage-windows
          - os: ubuntu-latest
            artifact: ravage-linux-x86_64
            arch: x86_64
          - os: ubuntu-24.04-arm
            artifact: ravage-linux-arm64
            arch: arm64
          - os: ubuntu-latest
            artifact: ravage-linux-armhf
            arch: armhf
            cross: true
          - os: macos-15-intel
            artifact: ravage-macos-x86_64
            arch: x86_64
          - os: macos-latest
            artifact: ravage-macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM32)
        if: matrix.cross
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build + Package in ARM32 container
        if: matrix.cross
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            python:3.12-slim \
            bash -c "
              apt-get update &&
              apt-get install -y python3-tk ffmpeg build-essential zlib1g-dev &&
              pip install -r requirements-build.txt &&
              pyinstaller --noconfirm --clean ravage.spec &&
              cd dist &&
              tar -czf ravage-linux-armhf.tar.gz ravage ravage-cli
            "

      - name: Setup Python
        if: ${{ !matrix.cross }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build deps
        if: ${{ !matrix.cross }}
        run: pip install -r requirements-build.txt

      - name: Build
        if: ${{ !matrix.cross }}
        run: pyinstaller --noconfirm --clean ravage.spec

      - name: Package binaries
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cd dist
          ARCH="${{ matrix.arch }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path ravage.exe, ravage-cli.exe -DestinationPath ravage-windows.zip -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            DMG_NAME="ravage-macos-${ARCH}.dmg"
            TAR_NAME="ravage-macos-${ARCH}.tar.gz"
            mkdir -p dmg-staging
            cp -R ravage.app dmg-staging/
            cp ravage-cli dmg-staging/
            echo "Drag ravage.app to Applications. ravage-cli is the command-line tool." > dmg-staging/README.txt
            hdiutil create -volname "RAVage (${ARCH})" -srcfolder dmg-staging -ov -format UDZO "$DMG_NAME"
            tar -czf "$TAR_NAME" -C dmg-staging ravage.app ravage-cli
            rm -rf dmg-staging
          else
            tar -czf "ravage-linux-${ARCH}.tar.gz" ravage ravage-cli
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/ravage-*
            dist/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ravage-windows.zip
            dist/ravage-macos-x86_64.dmg
            dist/ravage-macos-x86_64.tar.gz
            dist/ravage-macos-arm64.dmg
            dist/ravage-macos-arm64.tar.gz
            dist/ravage-linux-x86_64.tar.gz
            dist/ravage-linux-arm64.tar.gz
            dist/ravage-linux-armhf.tar.gz
